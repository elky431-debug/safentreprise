# Netlify — build Next.js (plugin @netlify/plugin-nextjs côté UI)
[build]
  command = "npm run build"
  publish = ".next"

# Variables OBLIGATOIRES (à définir dans Netlify UI, pas ici) :
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   NEXT_PUBLIC_APP_URL=https://safentreprise.com
#     ↳ sert à construire les liens de suivi insérés dans chaque message.
#       Sans elle, l'app retombe sur http://localhost:3000 et l'envoi de
#       campagne est REFUSÉ (voir verifierUrlPublique dans
#       src/lib/send/tracking.ts). Variable NEXT_PUBLIC_*, donc injectée au
#       build : redéployer après l'avoir ajoutée.
# Recommandées :
#   RESEND_API_KEY
#   SIMULATION_FROM_EMAIL
#   SUPABASE_SECRET_KEY
#
# Après ajout des NEXT_PUBLIC_* : redéployer (elles sont injectées au build).
